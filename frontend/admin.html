<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">Admin Panel</span>
    <div>
      <a href="index.html" class="btn btn-light me-2">Home</a>
      <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <!-- Add Room -->
  <div class="card p-4 shadow mb-4">
    <h3>Add Room</h3>
    <input id="title" class="form-control mb-2" placeholder="Title">
    <input id="price" class="form-control mb-2" placeholder="Price">
    <input id="location" class="form-control mb-2" placeholder="Location">
    <button onclick="addRoom()" class="btn btn-success">Add Room</button>
  </div>

  <!-- Rooms -->
  <h3>All Rooms</h3>
  <div id="adminRooms"></div>

  <!-- Bookings -->
  <h3>All Bookings</h3>
  <div id="adminBookings"></div>

</div>

<script src="script.js"></script>
</body>
</html>
