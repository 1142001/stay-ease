<!DOCTYPE html>
<html>
<head>
  <title>Rooms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">StayEase</span>
    <div>
      <a href="dashboard.html" class="btn btn-light me-2">My Bookings</a>
      <button onclick="logout()" class="btn btn-danger">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-4">

  <!-- Search + Filter -->
  <div class="row mb-4">
    <div class="col-md-4">
      <input id="searchInput" class="form-control" placeholder="Search rooms...">
    </div>
    <div class="col-md-3">
      <input id="minPrice" type="number" class="form-control" placeholder="Min Price">
    </div>
    <div class="col-md-3">
      <input id="maxPrice" type="number" class="form-control" placeholder="Max Price">
    </div>
    <div class="col-md-2">
      <button onclick="filterRooms()" class="btn btn-primary w-100">Filter</button>
    </div>
  </div>

  <div class="row" id="rooms"></div>
</div>

<script src="script.js"></script>
</body>
</html>
